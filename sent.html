<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marconi Design - Seu Freelancer Web</title>

    <link rel="shortcut icon" href="./img/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="./css/style.min.css" rel="stylesheet">
</head>

<style>
    body {
        font-weight: 600;
        background-color: #ccc;
    }

    img {
        width: 100%;
        max-width: 270px;
        height: auto;
        text-align: center;
    }

    h1 {
        color: green;
        margin-bottom: 20px;
    }

    p {
        color: #333;
    }

    b,
    a {
        color: #000 !important;
    }

    .enviado-texto {
        display: table;
        width: 90%;
        max-width: 700px;
        height: 420px;
        text-align: center;
        border: 1px solid #bbb;
        border-radius: 13px;
        margin: 5% auto;
        padding: 15px;
        background-color: #f1f1f1;
    }
</style>

<body>
    <div class="enviado-texto">
        <img src="./img/marconidesign.svg" alt="logo">
        <h1>Sua mensagem foi enviada!</h1>
        <h3>Em breve entraremos em contato.</h3>
        <p>
            Voltando para o site automáticamente em <b>5</b>
            <br />
            ou <a href="https://marconip.github.io/design/">Clique aqui</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <script src="./owl-carousel/jquery.min.js"></script>
    <script src="./owl-carousel/owl.carousel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.8/jquery.mask.min.js"></script>

    <script src="./js/geral.js"></script>

    <script>
        //TIME REGRESSIVO COM LINK NO FINAL
        var timeleft = 5;
        var downloadTimer = setInterval(function () {
            timeleft--;
            document.querySelector("b").textContent = timeleft;
            if (timeleft <= 0)
                clearInterval(downloadTimer);
        }, 1000);
        window.setTimeout(function () {
            window.location.href = "https://marconip.github.io/design/";
        }, 5000);
    </script>
</body>

</html>
